services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketera-app
    ports:
      - ${PORT}:${PORT}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ticketera-net

  db:
    image: mariadb:latest
    container_name: ticketera-db
    ports:
      - "3308:3306"
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD_ROOT}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketera-net

networks:
  ticketera-net:
    driver: bridge

